spring:
  application:
    name: backend

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:vyapaar}?createDatabaseIfNotExist=true&serverTimezone=Asia/Kolkata&sslMode=${DB_SSL_MODE:DISABLED}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update

    show-sql: true

    properties:
      hibernate:
        format_sql: true

server:
  port: ${PORT:8080}

# Module 15: receipt delivery. public-url builds the link that is shared with the buyer.
receipt:
  public-url: ${APP_PUBLIC_URL:http://localhost:8080}
  business-name: ${BUSINESS_NAME:VYAPAAR}
  business-phone: ${BUSINESS_PHONE:}
